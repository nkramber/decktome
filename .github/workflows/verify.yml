name: verify

# The workflow runs when the owner asks for it, and on one weekly
# schedule whose only job is the govulncheck scan (D-578). No pull
# request starts it: `make verify` runs the same checks on the owner's
# machine for nothing. A new dispatch cancels the run in progress.
#
# `all` runs every job. Without it the changes job reads the diff of this
# ref against main, and each job waits on that answer.
on:
  workflow_dispatch:
    inputs:
      all:
        description: "Run every job, and skip the changed-paths gate"
        type: boolean
        default: false
  # Monday 06:00 UTC. The vuln job is the only job that runs on the
  # schedule, at about 2 billed minutes a week (D-305).
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action is pinned to a commit SHA. The comment gives the tag the
# SHA resolves to. Bump the SHA and the comment together. Each pin was
# checked against its tag with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`.
# verified_at: 2026-08-29, source: https://api.github.com/repos/actions/checkout/git/ref/tags/v7.0.1
# and the same path for every other action below.
# Every job has a timeout. A hung test or install runs to the 6-hour
# default otherwise.
#
# Each job is billed by the minute, rounded up, so a job that need not
# run is skipped. The changes job reads the diff against the base branch
# and every other pull-request job waits on its answer (D-286). The
# scheduled run starts the vuln job only (D-305).
jobs:
  changes:
    name: "verify:changes"
    if: github.event_name == 'workflow_dispatch' && !inputs.all
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.diff.outputs.go }}
      gosum: ${{ steps.diff.outputs.gosum }}
      web: ${{ steps.diff.outputs.web }}
      proto: ${{ steps.diff.outputs.proto }}
      emulator: ${{ steps.diff.outputs.emulator }}
      docker: ${{ steps.diff.outputs.docker }}
      shell: ${{ steps.diff.outputs.shell }}
      eval: ${{ steps.diff.outputs.eval }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        # The base branch name enters through env, never through an
        # expression inside the script, so its text cannot run as shell.
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          base="origin/${BASE_REF}"
          git diff --name-only "$base...HEAD" > changed.txt
          echo "changed files:"; cat changed.txt
          has() { grep -Eq "$1" changed.txt && echo true || echo false; }
          {
            echo "go=$(has '^(go/|Makefile$|\.golangci\.yml$|\.github/workflows/)')"
            echo "gosum=$(has '^go/go\.(mod|sum)$')"
            echo "web=$(has '^(web/|\.nvmrc$|\.github/workflows/)')"
            echo "proto=$(has '^(proto/|buf\.|go/gen/|go/go\.(mod|sum)$|web/packages/api-client/|\.github/workflows/)')"
            # The emulator tests round-trip questions.Snapshot and the generated messages.
            echo "emulator=$(has '^(go/internal/(sessions|decks|cards|questions)/|go/gen/|proto/|go/go\.(mod|sum)$|\.github/workflows/)')"
            # The emulators image copies firebase.json and the firestore files, and asserts on them.
            echo "docker=$(has '^(docker/|compose\.yaml$|\.dockerignore$|firebase\.json$|firestore\.(rules|indexes\.json)$|go/go\.(mod|sum)$|\.nvmrc$|\.github/workflows/)')"
            echo "shell=$(has '^(scripts/|docs/|.*\.md$|Makefile$|\.github/workflows/)')"
            # Tier 0 of the eval harness reads the committed run files and the code that compares them (PR-15).
            echo "eval=$(has '^(docs/reference/eval/|go/internal/evalrun/|go/cmd/eval/|Makefile$|\.github/workflows/)')"
          } | tee -a "$GITHUB_OUTPUT"

  go:
    name: "verify:go"
    needs: [changes]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.all || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The LLM-defaults check diffs against the merge base, which a
          # shallow clone does not hold (D-305).
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: build
        run: go -C go build ./...
      # golangci-lint runs through the Makefile, built from source with
      # the repo's Go toolchain. The prebuilt action binary is compiled
      # with an older Go and refuses a newer go.mod target.
      - name: golangci-lint
        run: make lint-go
      - name: test
        run: go -C go test -race ./...
      # The known-vulnerability scan. It fails only on a vulnerability
      # that this code reaches (govulncheck reads the call graph). It
      # runs when the module graph changed, which is when the answer
      # can change. The weekly vuln job covers a new advisory against an
      # unchanged graph (D-305).
      - name: govulncheck
        if: needs.changes.outputs.gosum == 'true'
        run: go -C go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      # Guardrail 3: a model or price default change is a warning, never a failure.
      - name: llm defaults
        run: make llm-defaults-check

  # The weekly scan. A new advisory can hit a pinned module while go.sum
  # stays the same, and no pull request would run the scan (D-305).
  vuln:
    name: "verify:vuln"
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # Same pin as the go job above and scripts/dev.sh.
      - name: govulncheck
        run: go -C go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # The Firestore repos (sessions, decks) and the fake-GCS store skip
  # their tests without an emulator. This job gives them one.
  emulator:
    name: "verify:emulator"
    needs: [changes]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.all || needs.changes.outputs.emulator == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      # Same pin as docker/emulators.Dockerfile, scripts/doctor.sh, docs/setup.md.
      - run: npm install -g firebase-tools@14.14.0
      - name: firestore tests
        run: |
          firebase emulators:exec --only firestore --project mtg-local \
            "FIRESTORE_EMULATOR_HOST=127.0.0.1:8281 go -C go test -race -count=1 ./internal/sessions/ ./internal/decks/"
      - name: fake gcs tests
        run: |
          go -C go run github.com/fsouza/fake-gcs-server@v1.56.1 -scheme http -host 127.0.0.1 -port 4443 -filesystem-root /tmp/gcs &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4443/storage/v1/b >/dev/null && break; sleep 1; done
          STORAGE_EMULATOR_HOST=http://127.0.0.1:4443 FAKE_GCS_LIVE=1 go -C go test -race -count=1 ./internal/cards/ -run LiveStore

  web:
    name: "verify:web"
    needs: [changes]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.all || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      # A known vulnerability of high severity or worse fails the job.
      - run: pnpm --dir web audit --audit-level high
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web build

  proto:
    name: "verify:proto"
    needs: [changes]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.all || needs.changes.outputs.proto == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # buf breaking compares against main, so the full history is needed.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      # The buf binary is built from go/go.mod. Cache it on the module graph
      # so the proto job does not compile buf on every run.
      - id: buf
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin/buf
          key: buf-${{ runner.os }}-${{ hashFiles('go/go.sum') }}
      # The Makefile rebuilds .bin/buf when go/go.sum is newer. The checkout
      # writes go.sum at run time, and the cache restores buf with its saved
      # mtime, so the restored binary would always look stale. The touch
      # makes it newer than go.sum and keeps the cache useful.
      - if: steps.buf.outputs.cache-hit == 'true'
        run: touch .bin/buf
      - name: generated code is committed and current
        run: make proto-check
      - name: no breaking proto change against main
        run: make proto-breaking

  shell:
    name: "verify:shell"
    needs: [changes]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.all || needs.changes.outputs.shell == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The ubuntu-latest image ships shellcheck. The apt step covers an image that does not.
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck --version
          shellcheck scripts/*.sh
      # Every .md file is written in ASD-STE100 (CLAUDE.md rule 2). The
      # script checks the prose. Tables and code blocks are exempt.
      - name: ste check
        run: make ste-check

  # Tier 0 of the eval harness (PR-15). It compares every baseline of
  # docs/reference/eval with the newest committed run of its suite and
  # names the flips. It calls no provider, and it takes about one
  # minute of runner time. A run file that regresses a gate row fails.
  eval:
    name: "verify:eval"
    needs: [changes]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.all || needs.changes.outputs.eval == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: eval check
        run: make eval-check

  # The three images build when their inputs change, with no push. The
  # Go job already compiles the code the images hold, so a Go change
  # alone does not rebuild them.
  docker:
    name: "verify:docker"
    needs: [changes]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.all || needs.changes.outputs.docker == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f docker/api.Dockerfile .
      - run: docker build -f docker/worker.Dockerfile .
      - run: docker build -f docker/emulators.Dockerfile .
