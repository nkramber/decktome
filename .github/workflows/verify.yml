name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: "verify:go"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # golangci-lint runs through the Makefile, built from source with
      # the repo's Go toolchain. The prebuilt action binary is compiled
      # with an older Go and refuses a newer go.mod target.
      - name: golangci-lint
        run: make lint-go
      - name: test
        run: go -C go test -race ./...

  web:
    name: "verify:web"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web build

  proto:
    name: "verify:proto"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - name: generated code is committed and current
        run: make proto-check

  verify:
    name: verify
    needs: [go, web, proto]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: fan-in
        run: |
          echo "go=${{ needs.go.result }} web=${{ needs.web.result }} proto=${{ needs.proto.result }}"
          [ "${{ needs.go.result }}" = success ] && [ "${{ needs.web.result }}" = success ] && [ "${{ needs.proto.result }}" = success ]
