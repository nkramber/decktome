name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Every action is pinned to a commit SHA. The comment gives the tag the SHA
# resolved to on 2026-08-24. Bump the SHA and the comment together.
jobs:
  go:
    name: "verify:go"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: build
        run: go -C go build ./...
      # golangci-lint runs through the Makefile, built from source with
      # the repo's Go toolchain. The prebuilt action binary is compiled
      # with an older Go and refuses a newer go.mod target.
      - name: golangci-lint
        run: make lint-go
      - name: test
        run: go -C go test -race ./...
      # Guardrail 3: a model or price default change is a warning, never a failure.
      - name: llm defaults
        run: make llm-defaults-check

  web:
    name: "verify:web"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web build

  proto:
    name: "verify:proto"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # buf breaking compares against main, so the full history is needed.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      # The buf binary is built from go/go.mod. Cache it on the module graph
      # so the proto job does not compile buf on every run.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .bin/buf
          key: buf-${{ runner.os }}-${{ hashFiles('go/go.sum') }}
      - name: generated code is committed and current
        run: make proto-check
      - name: no breaking proto change against main
        run: make proto-breaking

  verify:
    name: verify
    needs: [go, web, proto]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: fan-in
        run: |
          echo "go=${{ needs.go.result }} web=${{ needs.web.result }} proto=${{ needs.proto.result }}"
          [ "${{ needs.go.result }}" = success ] && [ "${{ needs.web.result }}" = success ] && [ "${{ needs.proto.result }}" = success ]
