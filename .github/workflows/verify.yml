name: verify

# The workflow runs on every pull request and on every push to one
# (D-639). A pull request that changes docs alone skips the code jobs,
# and so does a docs-only push after a head that passed verify:gate
# (D-805). docs/tools/changed_paths.py holds the docs set and the rule.
# verify:shell runs on every head, so the document checks always run.
# `make verify` still runs the same checks on the owner's machine, and
# the two answer the same question.
#
# It also runs when the owner asks for it, and on one weekly schedule.
# A dispatch reads the diff of this ref against main and skips a job that
# ref does not touch, unless `all` says otherwise (D-286, now for the
# dispatch alone).
#
# A new run on one branch cancels the run in progress.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      all:
        description: "Run every job, and skip the changed-paths gate"
        type: boolean
        default: false
  # Monday 06:00 UTC. The vuln job is the one job the schedule starts,
  # and a pull request runs it too (D-639).
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action is pinned to a commit SHA. The comment gives the tag the
# SHA resolves to. Bump the SHA and the comment together. Each pin was
# checked against its tag with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`.
# verified_at: 2026-08-29, source: https://api.github.com/repos/actions/checkout/git/ref/tags/v7.0.1
# and the same path for every other action below.
# Every job has a timeout. A hung test or install runs to the 6-hour
# default otherwise.
#
# A pull request runs every code job unless the paths job reads a
# docs-only change (D-805). A dispatch still reads the diff and skips a
# job the ref does not touch, which keeps a hand run short. The scheduled
# run starts the vuln job alone.
jobs:
  # The paths job decides whether the code jobs of a pull request skip
  # (D-805). This step collects the facts alone, and the command of the
  # next step decides. A fault here fails verify:gate.
  paths:
    name: "verify:paths"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The job reads the check runs of the previous head.
    permissions:
      contents: read
      checks: read
    outputs:
      documents-alone: ${{ steps.read.outputs.documents-alone }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Each value of the event goes through env, and never into the script text.
      - name: write the facts of the change
        env:
          EVENT_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          facts="$RUNNER_TEMP/changed-paths"
          rm -rf "$facts"
          mkdir -p "$facts"

          # Three dots give the paths of the pull request from the merge
          # base. Two dots would also read each path that main changed
          # after the branch point. --no-renames lists both sides of a
          # move, so a move of code into docs/ names the code path too.
          git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$facts/pr-paths.txt"
          echo "The pull request changes these paths:"
          cat "$facts/pr-paths.txt"

          # The previous head is the before commit of a push. A new pull
          # request and a reopen give none. After a force push, the commit
          # is absent or is not an ancestor, and the whole pull request counts.
          if [ "$EVENT_ACTION" != "synchronize" ] || [ -z "$BEFORE_SHA" ] ||
             [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "The event '$EVENT_ACTION' gives no previous head."
            exit 0
          fi
          if ! git cat-file -e "$BEFORE_SHA^{commit}" ||
             ! git merge-base --is-ancestor "$BEFORE_SHA" "$HEAD_SHA"; then
            echo "The previous head $BEFORE_SHA is not an ancestor of $HEAD_SHA."
            exit 0
          fi

          git diff --no-renames --name-only "$BEFORE_SHA" "$HEAD_SHA" > "$facts/push-paths.txt"
          echo "The push changes these paths from $BEFORE_SHA:"
          cat "$facts/push-paths.txt"

          # A run tests the merge with main. Each path that a commit of main
          # changed after the branch point of the previous head goes here, so
          # a code change on main runs every job again.
          previous_base=$(git merge-base "$BEFORE_SHA" "$BASE_SHA")
          git log --no-renames --format= --name-only "$previous_base..$BASE_SHA" | sort -u > "$facts/base-paths.txt"
          echo "main changed these paths after $previous_base:"
          cat "$facts/base-paths.txt"

          # The API gives the latest run of each name. One JSON object a line.
          gh api --paginate "repos/$REPOSITORY/commits/$BEFORE_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | {name, status, conclusion, app: .app.slug}' \
            > "$facts/previous-checks.jsonl"
          echo "The previous head has these check runs:"
          cat "$facts/previous-checks.jsonl"
      - name: read the changed paths
        id: read
        run: |
          set -euo pipefail
          facts="$RUNNER_TEMP/changed-paths"
          arguments=(decide --event-name pull_request --output "$GITHUB_OUTPUT" --pr-paths "$facts/pr-paths.txt")
          if [ -f "$facts/push-paths.txt" ]; then
            arguments+=(--push-paths "$facts/push-paths.txt" --previous-checks "$facts/previous-checks.jsonl"
              --base-paths "$facts/base-paths.txt")
          fi
          python3 docs/tools/changed_paths.py "${arguments[@]}"

  changes:
    name: "verify:changes"
    if: github.event_name == 'workflow_dispatch' && !inputs.all
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.diff.outputs.go }}
      gosum: ${{ steps.diff.outputs.gosum }}
      web: ${{ steps.diff.outputs.web }}
      proto: ${{ steps.diff.outputs.proto }}
      emulator: ${{ steps.diff.outputs.emulator }}
      docker: ${{ steps.diff.outputs.docker }}
      shell: ${{ steps.diff.outputs.shell }}
      eval: ${{ steps.diff.outputs.eval }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        # The base branch name enters through env, never through an
        # expression inside the script, so its text cannot run as shell.
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          base="origin/${BASE_REF}"
          git diff --name-only "$base...HEAD" > changed.txt
          echo "changed files:"; cat changed.txt
          has() { grep -Eq "$1" changed.txt && echo true || echo false; }
          {
            echo "go=$(has '^(go/|Makefile$|\.golangci\.yml$|\.github/workflows/)')"
            echo "gosum=$(has '^go/go\.(mod|sum)$')"
            echo "web=$(has '^(web/|\.nvmrc$|\.github/workflows/)')"
            echo "proto=$(has '^(proto/|buf\.|go/gen/|go/go\.(mod|sum)$|web/packages/api-client/|\.github/workflows/)')"
            # The emulator tests round-trip questions.Snapshot and the generated messages.
            echo "emulator=$(has '^(go/internal/(sessions|decks|cards|questions)/|go/gen/|proto/|go/go\.(mod|sum)$|\.github/workflows/)')"
            # The emulators image copies firebase.json and the firestore files, and asserts on them.
            echo "docker=$(has '^(docker/|compose\.yaml$|\.dockerignore$|firebase\.json$|firestore\.(rules|indexes\.json)$|go/go\.(mod|sum)$|\.nvmrc$|\.github/workflows/)')"
            echo "shell=$(has '^(scripts/|docs/|\.claude/|.*\.md$|Makefile$|\.github/)')"
            # Tier 0 of the eval harness reads the committed run files and the code that compares them (PR-15).
            echo "eval=$(has '^(docs/reference/eval/|go/internal/evalrun/|go/cmd/eval/|Makefile$|\.github/workflows/)')"
          } | tee -a "$GITHUB_OUTPUT"

  go:
    name: "verify:go"
    needs: [changes, paths]
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && needs.paths.outputs.documents-alone != 'true') || (github.event_name == 'workflow_dispatch' && (inputs.all || needs.changes.outputs.go == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The LLM-defaults check diffs against the merge base, which a
          # shallow clone does not hold (D-305).
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: build
        run: go -C go build ./...
      # golangci-lint runs through the Makefile, built from source with
      # the repo's Go toolchain. The prebuilt action binary is compiled
      # with an older Go and refuses a newer go.mod target.
      - name: golangci-lint
        run: make lint-go
      - name: test
        run: go -C go test -race ./...
      # The known-vulnerability scan. It fails only on a vulnerability
      # that this code reaches (govulncheck reads the call graph). It
      # runs when the module graph changed, which is when the answer
      # can change. The weekly vuln job covers a new advisory against an
      # unchanged graph (D-305).
      - name: govulncheck
        if: ${{ github.event_name == 'pull_request' || needs.changes.outputs.gosum == 'true' }}
        run: go -C go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      # Guardrail 3: a model or price default change is a warning, never a failure.
      - name: llm defaults
        run: make llm-defaults-check

  # The scan runs on every pull request and once a week (D-639). The
  # weekly run is what catches a new advisory against a pinned module
  # while go.sum stays the same, and no pull request touches it (D-305).
  vuln:
    name: "verify:vuln"
    needs: [paths]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'pull_request' && needs.paths.outputs.documents-alone != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # Same pin as the go job above and scripts/dev.sh.
      - name: govulncheck
        run: go -C go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # The Firestore repos (sessions, decks) and the fake-GCS store skip
  # their tests without an emulator. This job gives them one.
  emulator:
    name: "verify:emulator"
    needs: [changes, paths]
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && needs.paths.outputs.documents-alone != 'true') || (github.event_name == 'workflow_dispatch' && (inputs.all || needs.changes.outputs.emulator == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      # Same pin as docker/emulators.Dockerfile, scripts/doctor.sh, docs/setup.md.
      - run: npm install -g firebase-tools@14.14.0
      - name: firestore tests
        run: |
          firebase emulators:exec --only firestore --project mtg-local \
            "FIRESTORE_EMULATOR_HOST=127.0.0.1:8281 go -C go test -race -count=1 ./internal/sessions/ ./internal/decks/"
      # The script seeds the fake GCS from the trimmed snapshot, and it fails
      # unless TestLiveFakeGCS passes by name (D-658). `make gcs-check` runs
      # the same script.
      - name: fake gcs tests
        run: scripts/gcs-check.sh

  web:
    name: "verify:web"
    needs: [changes, paths]
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && needs.paths.outputs.documents-alone != 'true') || (github.event_name == 'workflow_dispatch' && (inputs.all || needs.changes.outputs.web == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      # A known vulnerability of high severity or worse fails the job.
      - run: pnpm --dir web audit --audit-level high
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web build

  proto:
    name: "verify:proto"
    needs: [changes, paths]
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && needs.paths.outputs.documents-alone != 'true') || (github.event_name == 'workflow_dispatch' && (inputs.all || needs.changes.outputs.proto == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # buf breaking compares against main, so the full history is needed.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      # The buf binary is built from go/go.mod. Cache it on the module graph
      # so the proto job does not compile buf on every run.
      - id: buf
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin/buf
          key: buf-${{ runner.os }}-${{ hashFiles('go/go.sum') }}
      # The Makefile rebuilds .bin/buf when go/go.sum is newer. The checkout
      # writes go.sum at run time, and the cache restores buf with its saved
      # mtime, so the restored binary would always look stale. The touch
      # makes it newer than go.sum and keeps the cache useful.
      - if: steps.buf.outputs.cache-hit == 'true'
        run: touch .bin/buf
      - name: generated code is committed and current
        run: make proto-check
      - name: no breaking proto change against main
        run: make proto-breaking

  shell:
    name: "verify:shell"
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.all || needs.changes.outputs.shell == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The ubuntu-latest image ships shellcheck. The apt step covers an image that does not.
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck --version
          shellcheck scripts/*.sh
      # Every .md file is written in ASD-STE100 (CLAUDE.md rule 2). The
      # script checks the prose. Tables and code blocks are exempt.
      - name: ste check
        run: make ste-check
      # Every cited id and every repository path of a document resolves
      # (D-753). A dated record is exempt.
      - name: ref check
        run: make ref-check
      # The skill frontmatter, the one-pr-one-session wiring, and the tests
      # of the contract checker and the session hook (D-748).
      - name: lifecycle check
        run: make lifecycle-check
      # The byte budget of the files a session reads at start, and the
      # three lists of paid targets (D-749).
      - name: context budget
        run: make context-budget
      # Every pipeline of a Makefile recipe fails its target (F-160). The
      # runner has a make that honors .SHELLFLAGS, and the check proves the
      # recipe rule against that make too.
      - name: pipefail check
        run: make pipefail-check

  # Tier 0 of the eval harness (PR-15). It compares every baseline of
  # docs/reference/eval with the newest committed run of its suite and
  # names the flips. It calls no provider, and it takes about one
  # minute of runner time. A run file that regresses a gate row fails.
  eval:
    name: "verify:eval"
    needs: [changes, paths]
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && needs.paths.outputs.documents-alone != 'true') || (github.event_name == 'workflow_dispatch' && (inputs.all || needs.changes.outputs.eval == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: eval check
        run: make eval-check

  # The three images build when their inputs change, with no push. The
  # Go job already compiles the code the images hold, so a Go change
  # alone does not rebuild them.
  docker:
    name: "verify:docker"
    needs: [changes, paths]
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && needs.paths.outputs.documents-alone != 'true') || (github.event_name == 'workflow_dispatch' && (inputs.all || needs.changes.outputs.docker == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f docker/api.Dockerfile .
      - run: docker build -f docker/worker.Dockerfile .
      - run: docker build -f docker/emulators.Dockerfile .

  # verify:gate gives one stable check name for the code jobs of a pull
  # request (D-805). It passes when each code job passed, or when a
  # docs-only change skipped it. The paths job reads this check on the
  # previous head, so a run of docs-only pushes reads back to the last
  # head that ran the code jobs. A skip that no docs decision asked for
  # never passes the gate. verify:shell stays outside it and runs on every head.
  gate:
    name: "verify:gate"
    needs: [paths, go, vuln, emulator, web, proto, eval, docker]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: read the result of each code job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 docs/tools/changed_paths.py gate --needs "$NEEDS"
