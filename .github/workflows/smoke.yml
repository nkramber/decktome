name: smoke

# The Playwright smoke flow of PR-23 (D-313). It runs on a manual trigger
# only. One run takes about 5 minutes of Actions time, and the owner
# starts it before a merge that touches the user path. The flow signs in
# over the emulators, uploads the fixture export, builds a deck with the
# fake provider over the trimmed snapshot of the repo, opens the deck,
# and exports it. It calls no provider (D-552).
on:
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned to a commit SHA, as in verify.yml. The comment
# gives the tag the SHA resolves to. Each pin was checked against its tag
# with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`.
# verified_at: 2026-09-06, source: https://api.github.com/repos/actions/upload-artifact/git/ref/tags/v7.0.1
# and verify.yml for every other action below.
jobs:
  smoke:
    name: "smoke:flow"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      # Same pin as verify.yml, docker/emulators.Dockerfile, scripts/doctor.sh, docs/setup.md.
      - run: npm install -g firebase-tools@14.14.0
      - run: pnpm --dir web install --frozen-lockfile
      # The browser build is cached on the Playwright version, so a run
      # downloads it once per bump. The system libraries install on every
      # run, because the runner image does not hold them.
      - id: playwright
        run: echo "version=$(pnpm --dir web/apps/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --dir web/apps/web exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --dir web/apps/web exec playwright install-deps chromium
      # The build warms the cache, so the readiness wait of the script
      # covers the snapshot load alone.
      - name: build the api
        run: go -C go build ./cmd/api
      - name: smoke flow
        run: make smoke
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/apps/web/playwright-report
            web/apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
