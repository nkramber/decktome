# Keeps the pinned action SHAs, the image digests, the Go modules, and the
# npm packages current. Every pin in this repo is set by hand today, so
# nothing tells the owner when a pin is old (audit 2026-08-28, P-11).
#
# Every update of one ecosystem lands in one monthly pull request, and
# Dependabot never rebases it on its own. Separate pull requests each run
# the verify workflow, and every merge rebases the rest and runs it again
# (D-286).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: gomod
    directory: /go
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      go: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      web: { patterns: ["*"] }
    ignore:
      # typescript-eslint 8 does not support TypeScript 7. Both move
      # together in PR-11, by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      # plugin-react 6 needs Vite 8. It moves with vite.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      images: { patterns: ["*"] }
    ignore:
      # The golang tag follows go/go.mod and the node tag follows .nvmrc.
      # Bump those pins first, then the image, by hand.
      - dependency-name: golang
      - dependency-name: node
