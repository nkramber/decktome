# Container variant of the local stack (PR-0c). Native path: make dev.
# The emulator image binds 0.0.0.0 (see docker/emulators.Dockerfile) so the
# other services can reach the ports. The image CMD starts the emulators.
# Published ports bind 127.0.0.1 only. The emulators and the fake GCS
# accept every request without credentials, so the LAN must not see them.
services:
  emulators:
    build:
      context: .
      dockerfile: docker/emulators.Dockerfile
    ports:
      - "127.0.0.1:8281:8281"
      - "127.0.0.1:9199:9199"
      - "127.0.0.1:4100:4100"
    # Firestore export. Data survives a restart, as .local/firestore does for make dev.
    volumes:
      - ./.local/firestore-docker:/data/firestore
    # The Firestore emulator answers GET / with "Ok". The image has node and no curl.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8281/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  gcs:
    # Digest resolved from the registry manifest on 2026-08-26.
    image: fsouza/fake-gcs-server:1.56.1@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef
    command: ["-scheme", "http", "-port", "4443", "-filesystem-root", "/data"]
    volumes: [".local/gcs-docker:/data"]
    ports:
      - "127.0.0.1:4443:4443"
    # The image is alpine, so busybox wget is present. GET / answers 404, and
    # the bucket list answers 200, so the probe reads the bucket list.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4443/storage/v1/b"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment: &gcp-env
      PROJECT_ID: "mtg-local"
      FIRESTORE_EMULATOR_HOST: "emulators:8281"
      FIREBASE_AUTH_EMULATOR_HOST: "emulators:9199"
      STORAGE_EMULATOR_HOST: "http://gcs:4443"
      CARDS_BUCKET: "mtg-local-cards"
      # Same fast reload as scripts/dev.sh, so a seed shows up within 15 s.
      CARDS_RELOAD_SECONDS: "15"
    # The provider keys come from .env (A-11). The file may be absent, and
    # the api then refuses to start until it is written: the fixture fake
    # serves the health role only.
    env_file:
      - path: .env
        required: false
    depends_on:
      emulators:
        condition: service_healthy
      gcs:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"
    # /healthcheck is a static probe built in docker/api.Dockerfile. It calls GET /healthz.
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # One-shot card snapshot refresh, the Cloud Run job shape.
  # Run it on demand: docker compose --profile seed run --rm worker
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: ["-once"]
    environment: *gcp-env
    env_file:
      - path: .env
        required: false
    depends_on:
      gcs:
        condition: service_healthy
    profiles: [seed]
