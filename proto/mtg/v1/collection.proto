syntax = "proto3";

package mtg.v1;

import "google/protobuf/timestamp.proto";
import "mtg/v1/card.proto";

option go_package = "github.com/nkramber/decktome/go/gen/mtg/v1;mtgv1";

// Collection is one imported card list. The full collection is stored (D-16).
message Collection {
  string id = 1;
  string name = 2;
  ImportSource source = 3;
  google.protobuf.Timestamp imported_at = 4;
  // content_hash detects an identical re-upload (D-16).
  string content_hash = 5;
  repeated CollectionEntry entries = 6;
  // card_count is the total number of cards, copies included.
  int32 card_count = 7;
  // summary holds the counts the binder head shows. The import fills it
  // once, so the head reads a Collection with no entries and moves no
  // megabyte (D-392). A re-import refills it.
  CollectionSummary summary = 8;
}

// CollectionSummary is what the binder head and the binder controls
// show about a collection, without its entries (D-392). The import
// computes it, so no reader counts 2,657 rows to draw one header.
message CollectionSummary {
  // The merged PR-18 wrote top_sets and by_color here, and the review
  // replaced both (D-398, D-402). The numbers and the names stay
  // reserved, so the wire guard holds and no reader confuses the two.
  reserved 4, 5;
  reserved "top_sets", "by_color";
  // row_count is how many entries the collection holds. A ManaBox row is
  // one printing in one finish and one condition, so one card can hold
  // several (D-393).
  int32 row_count = 1;
  // unique_cards counts the distinct Oracle ids.
  int32 unique_cards = 2;
  // by_rarity counts cards per Scryfall rarity, copies included. The key
  // is the rarity as the snapshot writes it, for example "mythic".
  map<string, int32> by_rarity = 3;
  // art_oracle_ids are the cards the binder head shows the art of, the
  // rarest first. The head reads no entry, so the import picks them
  // (D-392). A card the reader owns in two printings appears once.
  repeated string art_oracle_ids = 6;
  // sets are every set the collection holds, largest first. The head
  // shows the first, and the binder's set filter lists them all (D-398).
  repeated SetCount sets = 7;
  // by_type counts cards per card type, copies included. A card of two
  // types counts once under each. The binder's type filter lists the
  // keys (D-398). The import reads the card index for it, so a
  // collection stored before the field holds none until the head
  // computes one.
  map<string, int32> by_type = 8;
}

// SetCount is one set and how many cards of it a collection holds.
message SetCount {
  string set_code = 1;
  string set_name = 2;
  int32 count = 3;
}

// CollectionEntry is one row: one printing with a quantity.
message CollectionEntry {
  // scryfall_id is the printing id, the ManaBox join key.
  string scryfall_id = 1;
  // oracle_id joins printings of one card for ownership counts.
  string oracle_id = 2;
  string name = 3;
  string set_code = 4;
  string collector_number = 5;
  int32 quantity = 6;
  Finish finish = 7;
  Condition condition = 8;
  // rarity of this printing (D-16).
  string rarity = 9;
  // language is the ManaBox language code, "en" today (D-23).
  string language = 10;
  string set_name = 11;
  // colors, card_types, and price_usd are display fields. No document
  // stores them. GetCollection fills them from the card index of the
  // day, so the price is never stale and an older collection needs no
  // rewrite (D-396). The binder filters and sorts on them.
  repeated Color colors = 12;
  repeated string card_types = 13;
  double price_usd = 14;
}

// BinderFilter is what the binder grid asks for (D-398). Every field
// runs on the server, so a match on a later page still shows. The
// color, the type, and the price read the display fields GetCollection
// fills from the card index of the day (D-396).
message BinderFilter {
  // query keeps a row whose card name holds this text, without regard
  // to case. Empty keeps them all.
  string query = 1;
  // set_code keeps one set. Empty keeps them all.
  string set_code = 2;
  // color keeps the cards of this color, and a card of two colors
  // answers to both. COLOR_UNSPECIFIED keeps them all.
  Color color = 3;
  // colorless keeps the cards of no color. It wins over color.
  bool colorless = 4;
  // card_type keeps one card type, as the type line names it, for
  // example "Instant". Empty keeps them all.
  string card_type = 5;
  // quantity keeps the rows of this many copies. Zero keeps them all.
  int32 quantity = 6;
  // quantity_or_more keeps the rows of quantity copies or more. Four
  // or more is a playset, and every count above it reads the same way.
  bool quantity_or_more = 7;
}

// BinderSort orders the rows of a binder page. The name breaks every
// tie, so one binder reads the same on every visit.
enum BinderSort {
  // BINDER_SORT_UNSPECIFIED orders by name.
  BINDER_SORT_UNSPECIFIED = 0;
  BINDER_SORT_NAME = 1;
  // BINDER_SORT_COUNT puts the largest count first.
  BINDER_SORT_COUNT = 2;
  BINDER_SORT_SET = 3;
  // BINDER_SORT_PRICE puts the dearest row first, and an unpriced row
  // last.
  BINDER_SORT_PRICE = 4;
}

// CollectionDiff is what changed between a stored collection and an
// uploaded file (D-393). It stores nothing: the reader reads it and
// then chooses whether to replace.
//
// A row is one printing in one finish and one condition, which is the
// row a ManaBox export writes. So a foil and a normal copy of one card
// are two rows, and a quantity change reads as changed rather than as
// an add beside a remove.
message CollectionDiff {
  // added are the rows the file holds and the collection does not.
  repeated CollectionEntry added = 1;
  // removed are the rows the collection holds and the file does not.
  repeated CollectionEntry removed = 2;
  // changed are the rows both hold with another quantity.
  repeated QuantityChange changed = 3;
  // added_cards, removed_cards, and changed_cards count the cards those
  // three lists move, copies included. A reader reads the counts before
  // the lists.
  int32 added_cards = 4;
  int32 removed_cards = 5;
  int32 changed_cards = 6;
  // identical says the file and the collection hold the same rows with
  // the same quantities. The content hash answers the same question for
  // an unchanged file, and this answers it for a file that was written
  // again with no change (D-16).
  bool identical = 7;
}

// QuantityChange is one row both sides hold, with two quantities.
message QuantityChange {
  CollectionEntry entry = 1;
  int32 from = 2;
  int32 to = 3;
}

// ImportSource names the file format of an import.
enum ImportSource {
  IMPORT_SOURCE_UNSPECIFIED = 0;
  IMPORT_SOURCE_MANABOX_CSV = 1;
  IMPORT_SOURCE_ARENA_TEXT = 2;
}

// Finish mirrors the ManaBox Foil column values.
enum Finish {
  FINISH_UNSPECIFIED = 0;
  FINISH_NORMAL = 1;
  FINISH_FOIL = 2;
  FINISH_ETCHED = 3;
}

// Condition mirrors the ManaBox Condition column values.
enum Condition {
  CONDITION_UNSPECIFIED = 0;
  CONDITION_MINT = 1;
  CONDITION_NEAR_MINT = 2;
  CONDITION_EXCELLENT = 3;
  CONDITION_GOOD = 4;
  CONDITION_LIGHT_PLAYED = 5;
  CONDITION_PLAYED = 6;
  CONDITION_POOR = 7;
}

// ImportReport lists what an import could not use. Nothing is dropped
// in silence (D-23, roadmap PR-4 gate).
message ImportReport {
  repeated UnresolvedRow unresolved = 1;
  int32 resolved_count = 2;
  // unresolved_by_reason counts rows per UnresolvedReason name (M-3).
  map<string, int32> unresolved_by_reason = 3;
}

// UnresolvedRow is one input row the importer rejected, with the reason.
message UnresolvedRow {
  int32 line = 1;
  string raw = 2;
  UnresolvedReason reason = 3;
}

// UnresolvedReason says why a row did not resolve.
enum UnresolvedReason {
  UNRESOLVED_REASON_UNSPECIFIED = 0;
  UNRESOLVED_REASON_UNKNOWN_CARD = 1;
  // UNRESOLVED_REASON_NON_ENGLISH: the app supports English only (D-23).
  UNRESOLVED_REASON_NON_ENGLISH = 2;
  UNRESOLVED_REASON_BAD_ROW = 3;
  // UNRESOLVED_REASON_NOT_PLAYABLE: the printing is a token, emblem, art
  // card, or other object that can not go in a deck.
  UNRESOLVED_REASON_NOT_PLAYABLE = 4;
  // UNRESOLVED_REASON_UNKNOWN_VALUE: a finish or condition value the
  // parser does not know.
  UNRESOLVED_REASON_UNKNOWN_VALUE = 5;
}
