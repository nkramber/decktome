syntax = "proto3";

package mtg.v1;

import "google/protobuf/timestamp.proto";
import "mtg/v1/collection.proto";
import "mtg/v1/deck.proto";
import "mtg/v1/format.proto";
import "mtg/v1/session.proto";

option go_package = "github.com/nkramber/decktome/go/gen/mtg/v1;mtgv1";

// AgentService is the deck-building conversation (roadmap PR-7, PR-8).
service AgentService {
  // Chat sends one user message and streams the agent's response events.
  rpc Chat(ChatRequest) returns (stream ChatResponse) {}
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {}
  // ListSessions lists the reader's conversations, newest first, without
  // their turns (roadmap PR-19).
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {}
  // UpdateSession writes the name (roadmap PR-19).
  rpc UpdateSession(UpdateSessionRequest) returns (UpdateSessionResponse) {}
  // DeleteSession removes a conversation for good. The decks it built
  // stay (roadmap PR-19).
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse) {}
  // ImportDeck stores a deck list that a user brings, and a session
  // that the revise turn reads (PR-70, D-845, D-851).
  rpc ImportDeck(ImportDeckRequest) returns (ImportDeckResponse) {}
  // ReadImportBracket asks the bracket judge again for an imported deck
  // whose bracket is the floor alone (D-854).
  rpc ReadImportBracket(ReadImportBracketRequest) returns (ReadImportBracketResponse) {}
}

message ListSessionsRequest {
  // page_size caps the answer. Zero takes the default, and the server
  // caps it.
  int32 page_size = 1;
  string page_token = 2;
}

message ListSessionsResponse {
  repeated SessionSummary sessions = 1;
  string next_page_token = 2;
}

// SessionSummary is one row of the sessions list: what a reader needs to
// find a conversation again, without its turns.
message SessionSummary {
  string id = 1;
  // name is what the reader called it, or empty. The list then shows
  // the first message.
  string name = 2;
  // first_message is the reader's first message, which names the request.
  string first_message = 3;
  string collection_id = 4;
  SessionStatus status = 5;
  int32 deck_count = 6;
  Usage usage = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message UpdateSessionRequest {
  string session_id = 1;
  // name is the new name. An empty name is an invalid argument, and a
  // name takes at most 200 bytes, as a deck name does.
  string name = 2;
}

message UpdateSessionResponse {
  SessionSummary session = 1;
}

message DeleteSessionRequest {
  string session_id = 1;
}

message DeleteSessionResponse {}

// BuildPhase names where a turn stands (roadmap PR-19). The stepper of
// the chat reads it beside the status lines.
enum BuildPhase {
  BUILD_PHASE_UNSPECIFIED = 0;
  // BUILD_PHASE_READING: the classifier reads the request.
  BUILD_PHASE_READING = 1;
  // BUILD_PHASE_SHORTLIST: the candidate list is built.
  BUILD_PHASE_SHORTLIST = 2;
  // BUILD_PHASE_BUILDING: the generator writes the deck.
  BUILD_PHASE_BUILDING = 3;
  // BUILD_PHASE_CHECKING: the rules engine checks the deck.
  BUILD_PHASE_CHECKING = 4;
  // BUILD_PHASE_REPAIRING: the repair turn runs.
  BUILD_PHASE_REPAIRING = 5;
  // BUILD_PHASE_DONE: the turn ended, with or without a deck.
  BUILD_PHASE_DONE = 6;
}

message ChatRequest {
  // session_id is empty on the first message. The first event returns it.
  string session_id = 1;
  string collection_id = 2;
  string message = 3;
  // answers carries structured replies to the last turn's questions.
  repeated Answer answers = 4;
  // 5 held seed and 6 held keep_oracle_ids, the two request levers of
  // PR-9. PR-9 left the MVP (D-256), and nothing ever read them. The
  // numbers and the names are reserved, so a later PR-9 must choose new
  // ones and no stored request can be misread (D-266).
  reserved 5, 6;
  reserved "seed", "keep_oracle_ids";
  // pool_rule answers the card-pool question before it is asked (D-359).
  // The chat screen knows the answer already: the reader named a
  // collection and said whether the deck may reach past it. UNSPECIFIED
  // leaves the question to the agent.
  PoolRule pool_rule = 7;
}

// AgentError is a failure the UI can act on.
message AgentError {
  // code is stable, for example "llm_unavailable" or "no_legal_deck".
  string code = 1;
  string message = 2;
  // retryable says a new attempt can succeed.
  bool retryable = 3;
}

// ChatResponse is one streamed step of the agent's turn.
message ChatResponse {
  oneof event {
    // session_started carries the new session id, first event only.
    string session_started = 1;
    // text_delta is the next piece of the agent's prose.
    string text_delta = 2;
    // question asks the user for a missing slot.
    Question question = 3;
    // slots is the updated slot state after this turn.
    Slots slots = 4;
    // status is a short progress line, for example "building candidates".
    string status = 5;
    // deck is the finished, validated deck.
    Deck deck = 6;
    // error is the old string failure. Deprecated: read failure.
    string error = 7 [deprecated = true];
    // failure is a user-facing failure. It ends the turn.
    AgentError failure = 8;
    // usage is the session total after this turn (M-1).
    Usage usage = 9;
    // phase says where the turn stands. It is additive beside status:
    // the status line carries the words, and the phase carries the step
    // the stepper lights (roadmap PR-19).
    BuildPhase phase = 10;
  }
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

// ImportDeckRequest carries one deck list: an Archidekt text export or an
// Arena list (D-845). A list that needs an answer comes back with the
// question, and the client sends the list again with the answer.
message ImportDeckRequest {
  string text = 1;
  // name is the deck name. The form fills it from the file name.
  string name = 2;
  // collection_id names the collection that marks the owned cards, or
  // is empty for no owned mark (D-849).
  string collection_id = 3;
  // format is the pick of the user for a list that is not Commander:
  // Standard, Modern, or the house format for neither (D-857).
  FormatId format = 4;
  // commander_oracle_ids is the pick of the user for a Commander list
  // with no commander mark (D-847).
  repeated string commander_oracle_ids = 5;
}

message ImportDeckResponse {
  // deck and session_id are set when the import stored the deck.
  Deck deck = 1;
  string session_id = 2;
  // needs_format says the list is not Commander and the request named
  // no format. The client asks Standard, Modern, or neither.
  bool needs_format = 3;
  // commander_options are the cards of the list that can lead a deck,
  // when the list marks no commander. The client asks for a pick.
  repeated DeckCard commander_options = 4;
  // unresolved names each line that matched no card. The import skips
  // it (D-846).
  repeated UnresolvedRow unresolved = 5;
}

message ReadImportBracketRequest {
  string deck_id = 1;
}

message ReadImportBracketResponse {
  Deck deck = 1;
}
