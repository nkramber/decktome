syntax = "proto3";

package mtg.v1;

import "mtg/v1/deck.proto";
import "mtg/v1/format.proto";
import "mtg/v1/session.proto";

option go_package = "github.com/nkramber/mtg-deck-builder/go/gen/mtg/v1;mtgv1";

// DeckService reads, validates, and exports decks.
//
// An Export RPC with ExportRequest, ExportResponse, and ExportFormat left
// the contract with no implementation (D-266). ExportDeck is its
// replacement, and it lands with its implementation (PR-13, D-15).
service DeckService {
  rpc GetDeck(GetDeckRequest) returns (GetDeckResponse) {}
  rpc ListDecks(ListDecksRequest) returns (ListDecksResponse) {}
  // Validate runs the rules engine on a deck (roadmap PR-5).
  rpc Validate(ValidateRequest) returns (ValidateResponse) {}
  // ExportDeck renders one of the caller's decks as text (D-15, D-307
  // to D-309).
  rpc ExportDeck(ExportDeckRequest) returns (ExportDeckResponse) {}
  // UpdateDeck writes the two fields a user owns: the name and the
  // favorite mark (PR-17). It changes nothing the agent built.
  rpc UpdateDeck(UpdateDeckRequest) returns (UpdateDeckResponse) {}
  // DeleteDeck removes one deck for good (PR-17). The session keeps the
  // id in deck_ids, and the chat shows the deck as deleted.
  rpc DeleteDeck(DeleteDeckRequest) returns (DeleteDeckResponse) {}
  // ShareDeck makes a share link for one of the caller's decks and
  // answers the token once (D-315). A deck with a link gets a new one,
  // and the old link dies. The store keeps a hash of the token, never
  // the token.
  rpc ShareDeck(ShareDeckRequest) returns (ShareDeckResponse) {}
  // RevokeShare ends the link of one of the caller's decks.
  rpc RevokeShare(RevokeShareRequest) returns (RevokeShareResponse) {}
  // GetSharedDeck reads a shared deck by its token. It needs no sign-in,
  // a rate limit per client address bounds it, and the answer carries no
  // user field (guardrail 13). A revoked or unknown token is NotFound.
  rpc GetSharedDeck(GetSharedDeckRequest) returns (GetSharedDeckResponse) {}
  // ExportSharedDeck renders a shared deck as Arena text, with the
  // default paper printings. It needs no sign-in, under the same limit.
  rpc ExportSharedDeck(ExportSharedDeckRequest) returns (ExportSharedDeckResponse) {}
}

message ShareDeckRequest {
  string deck_id = 1;
}

message ShareDeckResponse {
  // token is the secret of the link, shown once. The page is /d/<token>.
  string token = 1;
}

message RevokeShareRequest {
  string deck_id = 1;
}

message RevokeShareResponse {}

message GetSharedDeckRequest {
  string token = 1;
}

message GetSharedDeckResponse {
  SharedDeck deck = 1;
}

message ExportSharedDeckRequest {
  string token = 1;
}

message ExportSharedDeckResponse {
  string text = 1;
  string file_name = 2;
}

// ExportFormat names a text shape of a deck.
enum ExportFormat {
  EXPORT_FORMAT_UNSPECIFIED = 0;
  // EXPORT_FORMAT_ARENA_TEXT is one card per line: the count, the full
  // name, the set code in parentheses, and the collector number. The
  // commander comes first under a "Commander" header, the main deck
  // under "Deck", and the sideboard under "Sideboard". ManaBox imports
  // this shape, and collections.ParseArenaText reads it (D-15). An owned
  // card names the owned printing, else the default paper printing
  // (D-307).
  EXPORT_FORMAT_ARENA_TEXT = 1;
  // EXPORT_FORMAT_BUY_LIST_TEXT is one "count name" line per card the
  // user still needs: the count minus the owned count over the commander,
  // the main deck, and the sideboard, then the upgrades under an
  // "Upgrades" header (D-308, D-309).
  EXPORT_FORMAT_BUY_LIST_TEXT = 2;
}

message ExportDeckRequest {
  string deck_id = 1;
  // format defaults to EXPORT_FORMAT_ARENA_TEXT when unspecified.
  ExportFormat format = 2;
}

message ExportDeckResponse {
  string text = 1;
  // file_name is the suggested download name, with its extension.
  string file_name = 2;
}

message GetDeckRequest {
  string deck_id = 1;
}

message GetDeckResponse {
  Deck deck = 1;
}

message ListDecksRequest {
  // page_size caps one page. Zero means 24, and the server caps it at 100.
  int32 page_size = 1;
  // page_token continues the listing of the same filter. An empty token
  // starts at the newest deck. A token from another filter is an invalid
  // argument.
  string page_token = 2;
  // format keeps the decks of one format. UNSPECIFIED keeps them all.
  FormatId format = 3;
  // favorite keeps the favorites when true, and the rest when false.
  // Unset keeps them all.
  optional bool favorite = 4;
  // query keeps the decks whose name or commander name holds this text,
  // without regard to case. Empty keeps them all.
  string query = 5;
  // power_bracket keeps the Commander decks of one bracket, 1 to 5.
  // Zero keeps them all. PowerLevel is a oneof, so the two arms of the
  // power filter are two fields (OQ-47).
  int32 power_bracket = 6;
  // power_sixty_step keeps the 60-card decks of one step.
  // UNSPECIFIED keeps them all.
  SixtyStep power_sixty_step = 7;
  // session_id keeps the decks one chat built, which is the version
  // history of a deck (PR-17). Empty keeps them all.
  string session_id = 8;
}

message ListDecksResponse {
  repeated Deck decks = 1;
  // next_page_token reads the next page of the same filter. Empty means
  // the listing ended.
  string next_page_token = 2;
}

message UpdateDeckRequest {
  string deck_id = 1;
  // name renames the deck. Unset leaves the name as it is, and an empty
  // string is an invalid argument.
  optional string name = 2;
  // favorite sets or clears the star. Unset leaves the mark as it is.
  optional bool favorite = 3;
}

message UpdateDeckResponse {
  // deck is the whole deck after the write.
  Deck deck = 1;
}

message DeleteDeckRequest {
  string deck_id = 1;
}

message DeleteDeckResponse {}

message ValidateRequest {
  Deck deck = 1;
  // pool_rule selects the ownership check (D-37). UNSPECIFIED means
  // ANY_CARD when collection_id is empty, else OWNED_FIRST.
  PoolRule pool_rule = 2;
  // collection_id names the user's collection for the ownership check.
  string collection_id = 3;
}

message ValidateResponse {
  ValidationResult result = 1;
}
