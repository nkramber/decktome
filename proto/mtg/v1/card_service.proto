syntax = "proto3";

package mtg.v1;

import "mtg/v1/card.proto";

option go_package = "github.com/nkramber/decktome/go/gen/mtg/v1;mtgv1";

// CardService reads the card database (roadmap PR-2).
service CardService {
  // Lookup finds one card by exact name, Scryfall id, or Oracle id.
  rpc Lookup(LookupRequest) returns (LookupResponse) {}
  // Search filters the card database. No free-text ranking in v1.
  rpc Search(SearchRequest) returns (SearchResponse) {}
  // GetCards returns up to 120 cards by Oracle id in one call. The deck
  // view needs the art, the type line, the mana cost, and the faces of
  // every card, and DeckCard carries only the id and the name (ui plan
  // of 2026-08-28, section 4). An id the index does not know goes in
  // missing_oracle_ids, never dropped in silence.
  rpc GetCards(GetCardsRequest) returns (GetCardsResponse) {}
  // GetRulings returns the Scryfall rulings of one card, oldest first,
  // with the date of the card snapshot they come from (PR-20). A card the
  // index does not know answers NotFound. A snapshot with no rulings
  // file answers an empty list and has_rulings false.
  rpc GetRulings(GetRulingsRequest) returns (GetRulingsResponse) {}
  // GetPrintings returns every playable printing of one card with its
  // price, newest set first (PR-20). A digital printing carries its mark.
  rpc GetPrintings(GetPrintingsRequest) returns (GetPrintingsResponse) {}
}

message GetRulingsRequest {
  string oracle_id = 1;
}

message GetRulingsResponse {
  repeated Ruling rulings = 1;
  // as_of is the ISO date of the card snapshot the rulings come from.
  string as_of = 2;
  // has_rulings is false when the snapshot carried no rulings file, so
  // a client can tell "no ruling" from "no data".
  bool has_rulings = 3;
}

message GetPrintingsRequest {
  string oracle_id = 1;
}

message GetPrintingsResponse {
  repeated Printing printings = 1;
  // price_as_of is the ISO date of the prices, the snapshot date.
  string price_as_of = 2;
}

message GetCardsRequest {
  // oracle_ids holds at most 120 ids. A repeated id counts once.
  repeated string oracle_ids = 1;
}

message GetCardsResponse {
  // cards come back in request order, without the missing ones.
  repeated Card cards = 1;
  repeated string missing_oracle_ids = 2;
}

message LookupRequest {
  oneof key {
    // name must match the exact English card name (guardrail 4).
    string name = 1;
    string scryfall_id = 2;
    string oracle_id = 3;
  }
}

message LookupResponse {
  Card card = 1;
}

message SearchRequest {
  // colors_within keeps cards whose color identity fits these colors.
  repeated Color colors_within = 1;
  // type_contains matches a word in the type line, for example "Creature".
  string type_contains = 2;
  repeated string keywords = 3;
  // oracle_tags are Scryfall Tagger slugs, for example "lifegain".
  repeated string oracle_tags = 4;
  // legal_in keeps cards legal in this Scryfall format key.
  string legal_in = 5;
  int32 page_size = 6;
  string page_token = 7;
}

message SearchResponse {
  repeated Card cards = 1;
  string next_page_token = 2;
}
