syntax = "proto3";

package mtg.v1;

import "mtg/v1/format.proto";
import "mtg/v1/card.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/nkramber/mtg-deck-builder/go/gen/mtg/v1;mtgv1";

// Session is one deck-building conversation.
message Session {
  string id = 1;
  string collection_id = 2;
  Slots slots = 3;
  repeated Turn turns = 4;
  repeated string deck_ids = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  SessionStatus status = 8;
  // usage is the session's LLM token and cost total (M-1).
  Usage usage = 9;
  // name is what the reader called the conversation (roadmap PR-19).
  // Empty means no name, and the list shows the first message.
  string name = 10;
}

// SessionStatus says where the conversation stands.
enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  // SESSION_STATUS_ASKING: at least one slot is still empty.
  SESSION_STATUS_ASKING = 1;
  // SESSION_STATUS_READY: every slot is filled or skipped. A build can run.
  SESSION_STATUS_READY = 2;
  // SESSION_STATUS_BUILT: the latest deck is in deck_ids.
  SESSION_STATUS_BUILT = 3;
}

// Usage is the LLM spend of one session (M-1). A false priced means the
// cost is unknown, not zero. Zero calls means nothing was instrumented.
message Usage {
  int32 calls = 1;
  int64 input_tokens = 2;
  int64 cached_input_tokens = 3;
  int64 output_tokens = 4;
  int64 reasoning_tokens = 5;
  double cost_usd = 6;
  bool priced = 7;
}

// Slots hold what the agent knows so far (roadmap PR-7).
// slot_states says for each slot whether it is empty, filled, or skipped
// by the user. A zero value alone can not tell "not asked" from "declined".
message Slots {
  Format format = 1;
  PowerLevel power = 2;
  repeated Color colors = 3;
  // theme is the plan in the user's words, for example "lifegain".
  string theme = 4;
  // commander_oracle_ids is filled when the user names a commander.
  repeated string commander_oracle_ids = 5;
  PoolRule pool_rule = 6;
  // budget_usd is the cap the user named. Zero means no cap given.
  // budget_scope says what the cap covers, which the budget-scope
  // question asks (D-77, D-238).
  double budget_usd = 7;
  BudgetScope budget_scope = 11;
  // house_rules is what the user means when the format is HOUSE, in the
  // user's own words (D-3). The build copies it to Format.house_rules.
  // Empty for every other format (D-265).
  string house_rules = 12;
  // locked_oracle_ids are cards the user wants in the deck.
  repeated string locked_oracle_ids = 8;
  // 9 held plan_variant, which separated two builds of one theme. PR-9
  // left the MVP, and nothing ever set it (D-256). The plan-choice row
  // that closed on it retired with A-6 of the 2026-08-28 audit.
  reserved 9;
  reserved "plan_variant";
  // set_codes limits the deck to the sets the reader named, lowercase
  // and sorted. It holds a whole set family: a base set and every
  // product Scryfall names as its child (D-376). Empty means every set.
  // Basic lands are never filtered by it (D-378).
  repeated string set_codes = 13;
  // exclude_precon_keys are the precon products the deck uses no card
  // of, as keys of the precon table (D-407, D-408). The build subtracts
  // each product's copies from the owned counts, so a surplus copy stays
  // usable, and a card with no copy left leaves the pool. Empty means no
  // exclusion.
  repeated string exclude_precon_keys = 14;
  // slot_states is keyed by slot name: scope, deck_count, format,
  // power, colors, theme, commander, pool_rule, budget, house_rules.
  // A refinement row keys its own name beside them, for example
  // budget_scope or commander_pick. "scope" records that the agent said
  // it builds Magic decks only, after the user asked for something else.
  // "set" and "set_outside_mana" are the two set rows (D-376, D-382).
  // "precons" is the precon exclusion, and "precon_unresolved" the row
  // that asks which product a name means (D-496).
  map<string, SlotState> slot_states = 10;
}

// BudgetScope says what a budget covers. The user names one number, and
// the budget-scope question asks which of the two they mean (D-77). The
// answer had nowhere to go until D-238, so the agent asked it and
// discarded it.
enum BudgetScope {
  // BUDGET_SCOPE_UNSPECIFIED: the user gave a number and no scope. The
  // cap reads as the cards to buy, which is the common meaning.
  BUDGET_SCOPE_UNSPECIFIED = 0;
  // BUDGET_SCOPE_CARDS_TO_BUY caps what the user must acquire.
  BUDGET_SCOPE_CARDS_TO_BUY = 1;
  // BUDGET_SCOPE_WHOLE_DECK caps the value of every card, owned copies
  // included.
  BUDGET_SCOPE_WHOLE_DECK = 2;
}

// SlotState is the fill state of one slot (roadmap PR-7 gate: no repeated
// question).
enum SlotState {
  SLOT_STATE_UNSPECIFIED = 0;
  // SLOT_STATE_EMPTY: not filled and not yet asked.
  SLOT_STATE_EMPTY = 1;
  // SLOT_STATE_ASKED: a question is out, no answer mapped yet.
  SLOT_STATE_ASKED = 2;
  SLOT_STATE_FILLED = 3;
  // SLOT_STATE_SKIPPED: the user declined. The agent uses a default.
  SLOT_STATE_SKIPPED = 4;
}

// PoolRule says how the collection constrains the deck (D-2).
enum PoolRule {
  POOL_RULE_UNSPECIFIED = 0;
  // POOL_RULE_OWNED_FIRST leads with owned cards and fills what the
  // collection can not from the whole database, in score order (D-359).
  // It lists upgrades on top: cards worth buying that the deck does not
  // already hold.
  POOL_RULE_OWNED_FIRST = 1;
  POOL_RULE_OWNED_ONLY = 2;
  POOL_RULE_ANY_CARD = 3;
}

// Turn is one exchange in the conversation.
message Turn {
  // user_message is what the user wrote.
  string user_message = 1;
  // agent_message is what the agent answered.
  string agent_message = 2;
  // questions the agent asked in this turn, when it asked.
  repeated Question questions = 3;
  google.protobuf.Timestamp at = 4;
  // answers maps the user's replies to questions, when the client sent
  // structured answers.
  repeated Answer answers = 5;
  // revision_brief is the brief the revise role returned for this turn,
  // as the JSON it wrote, so a wrong revision is readable after the
  // fact (D-449). Empty on a turn with no revise call.
  string revision_brief = 6;
}

// Answer is one reply to a Question.
message Answer {
  // question_id matches Question.id.
  string question_id = 1;
  // option_index is the chosen option. Unset means free text in
  // `text`. Explicit presence separates "option 0" from "no option",
  // which the proto3 default of 0 could not (D-266).
  optional int32 option_index = 2;
  string text = 3;
  // declined is true when the user handed the choice back with no value
  // (D-353). The slot closes and the generator applies the default the
  // corpus names. A declined answer carries no option_index and no text.
  bool declined = 4;
}

// Question is one clarifying question (roadmap PR-7, D-25).
message Question {
  // id is unique in the session. Answers refer to it.
  string id = 6;
  // slot names the empty slot this question fills.
  string slot = 1;
  string text = 2;
  // options are suggested answers. The user can answer in free text.
  repeated string options = 3;
  // invented marks a model-invented question (D-25). Catalog otherwise.
  bool invented = 4;
  // gap_score is the catalog-fit score that allowed an invented question.
  double gap_score = 5;
  // catalog_text is the catalog question an invented question replaced.
  // Empty when invented is false. M-5 scores catalog_enough and
  // invented_better, and neither can be judged without both texts (D-66).
  string catalog_text = 7;
  // option_oracle_ids is parallel to options. An option that is an exact
  // card name carries the card's Oracle id, so the UI can show the art
  // and the rules text of a commander offer (D-287). An option that is
  // not a card carries an empty string. Empty when no option is a card.
  repeated string option_oracle_ids = 8;
  // closed says the options are the whole answer space, for example the
  // three formats the app builds. The UI offers no free-text field for
  // a closed question (D-295).
  bool closed = 9;
  // option_partner_oracle_ids is parallel to options as well. A commander
  // pair reads as "A + B" in one option, and one Oracle id can not carry
  // two cards (D-361). The first card goes in option_oracle_ids, and the
  // second one here. Every other option carries an empty string.
  repeated string option_partner_oracle_ids = 10;
}
