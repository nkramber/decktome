syntax = "proto3";

package mtg.v1;

import "mtg/v1/card.proto";
import "mtg/v1/format.proto";
import "mtg/v1/session.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/nkramber/decktome/go/gen/mtg/v1;mtgv1";

// Deck is one generated deck.
message Deck {
  string id = 1;
  string name = 2;
  Format format = 3;
  PowerLevel power = 4;
  // summary is one paragraph on the deck's style and purpose (D-19).
  string summary = 5;
  // commander_oracle_ids holds one commander, or two for partners.
  repeated string commander_oracle_ids = 6;
  repeated DeckCard cards = 7;
  ValidationResult validation = 8;
  // legality_as_of is the card-snapshot date of the build's validation,
  // ISO 8601. It is a copy: validation.legality_as_of is authoritative,
  // because the last validation writes it. The UI shows this copy.
  string legality_as_of = 9;
  // 10 held seed, which reproduced a build on request (D-18). PR-9 left
  // the MVP, and nothing ever set it. The number and the name are
  // reserved, so a later PR-9 must choose a new one and no stored deck
  // can be misread (D-256).
  reserved 10;
  reserved "seed";
  string session_id = 11;
  google.protobuf.Timestamp created_at = 12;
  // stale is reserved for the staleness pass (D-29, I-1), unset today.
  bool stale = 13;
  // stale_oracle_ids is reserved for the staleness pass (D-29, I-1),
  // unset today.
  repeated string stale_oracle_ids = 14;
  // sideboard holds up to 15 cards in 60-card formats. Empty in Commander.
  repeated DeckCard sideboard = 15;
  // companion_oracle_id names the companion, when the deck has one.
  // The companion sits in the sideboard and must pass its own check (F-18).
  string companion_oracle_id = 16;
  // upgrades lists unowned cards that improve the deck, with prices (D-2,
  // roadmap PR-6). Empty in owned-only mode. In any-card mode the buy list
  // is the unowned part of cards instead (D-37).
  repeated DeckCard upgrades = 17;
  // buy_cost_usd sums price_usd over the cards the user does not own.
  // Zero when every card is owned or no price is known.
  double buy_cost_usd = 18;
  // revised_from_deck_id names the deck this one revised, when the user
  // asked for a change after a build (PR-12B, D-283). Empty for a first
  // build and for a full rebuild after a slot change.
  string revised_from_deck_id = 19;
  // revision_note is the reply the user read with the revision: what
  // changed, and what the agent declined and why (D-284). Built from the
  // diff, not from the model.
  string revision_note = 20;
  // favorite marks a deck the user starred in the library (PR-17).
  // UpdateDeck is the one writer.
  bool favorite = 21;
  // card_count sums count over cards, the main deck alone. The list view
  // of ListDecks carries no cards, so it sets this field instead
  // (PR-17). GetDeck reads the whole deck, and its cards are the source.
  int32 card_count = 22;
  // profile is the bracket profile of the built deck: the feature
  // vector, the band of each feature, the goldfish numbers, and the
  // content check (PR-14A, D-451 to D-453). Unset on a deck built
  // before PR-14A, and on a deck the profiler did not read.
  DeckProfile profile = 23;
  // quality is the grade of the deck quality model: the tier, the score,
  // and the three strongest reasons in words (PR-14B, D-413 to D-417).
  // Unset on a deck built before PR-14B, and when no model is loaded.
  DeckQuality quality = 24;
  // shared says a share link exists for this deck (D-315). The token
  // itself is never stored, so a new link replaces the old one.
  bool shared = 25;
}

// DeckQuality is the grade of the deck quality model (PR-14B). The
// model is one fitted scorer per format over the published lists, and
// it runs on the deterministic side: no prompt holds a weight.
message DeckQuality {
  // tier is the ladder word of D-414: great, good, typical, baseline,
  // or bad.
  string tier = 1;
  // score is the expected rung over the ladder, 0 for the bottom and
  // 1 for the top.
  double score = 2;
  // reasons are the three strongest signals in words, the strongest
  // first.
  repeated string reasons = 3;
  // model_version names the fit the grade came from.
  string model_version = 4;
  // probabilities holds one entry per tier of the format's ladder, in
  // ladder order, worst first.
  repeated TierProbability probabilities = 5;
}

// TierProbability is the model's probability of one tier.
message TierProbability {
  string tier = 1;
  double probability = 2;
}

// DeckProfile is the bracket profile (PR-14A). A bracket is a set of
// numbers the app builds to and checks, and this is the check.
message DeckProfile {
  // bracket is the Commander bracket the bands apply to, 0 for a 60-card
  // deck, where the bands follow the power step.
  int32 bracket = 1;
  // features holds one row per feature, with its band.
  repeated ProfileFeature features = 2;
  // goldfish holds the simulation numbers (D-453).
  Goldfish goldfish = 3;
  // content is the content-rule check against Commander Spellbook.
  ContentCheck content = 4;
  // bands_verified_at is the verified_at date of the band data.
  string bands_verified_at = 5;
}

// ProfileFeature is one measured number and the band it must sit in.
message ProfileFeature {
  // key names the feature, for example "land" or "avg_mana_value".
  string key = 1;
  double value = 2;
  // low and high are the band. A band with no floor has low 0, and a
  // band with no ceiling has_high set to false.
  double low = 3;
  double high = 4;
  bool has_high = 5;
  // off_band says the value sits outside the band.
  bool off_band = 6;
  // note is one line for the reader, for example the cards counted.
  string note = 7;
}

// Goldfish is the opening-hand simulation (D-453): no opponent, lands
// and rocks on curve, the London mulligan.
message Goldfish {
  // hands is how many games the simulation dealt.
  int32 hands = 1;
  // commander_turn is the mean turn the deck can cast its commander.
  double commander_turn = 2;
  // mana_turn_four is the mean mana available on turn four.
  double mana_turn_four = 3;
  // share_two_to_four_lands is the share of first seven-card hands that
  // held two to four lands.
  double share_two_to_four_lands = 4;
}

// ContentCheck is the content-rule read of a deck: the cards and combos
// a bracket forbids, from Commander Spellbook (PR-14A).
message ContentCheck {
  // checked says the endpoint answered. When false, error says why, and
  // the deck carries no content finding.
  bool checked = 1;
  string error = 2;
  // source_tag is the endpoint's own bracket word for the deck.
  string source_tag = 3;
  repeated string game_changers = 4;
  repeated string mass_land_denial = 5;
  repeated string extra_turns = 6;
  repeated ComboHit combos = 7;
}

// ComboHit is one combo the deck holds, as the endpoint read it.
message ComboHit {
  string id = 1;
  repeated string cards = 2;
  bool two_card = 3;
  int32 speed = 4;
  bool extra_turn = 5;
  bool mass_land_denial = 6;
}

// DeckCard is one card choice with its reason.
// SharedDeck is the public read of a deck through its share link
// (D-315, guardrail 13). It holds what a reader of the link needs and no
// user field: no session, no collection, no owned mark, no owned
// printing, and no price of the owner's copies. A test reads this
// message and SharedCard from the proto text and proves it.
message SharedDeck {
  string name = 1;
  Format format = 2;
  PowerLevel power = 3;
  string summary = 4;
  repeated string commander_oracle_ids = 5;
  repeated SharedCard cards = 6;
  repeated SharedCard sideboard = 7;
  string legality_as_of = 8;
  int32 card_count = 9;
}

// SharedCard is one entry of a shared deck, with the card data inline,
// so the page needs no second call (D-315). The card carries its
// default paper printing with the artist (D-6) and the public price.
message SharedCard {
  string oracle_id = 1;
  string name = 2;
  int32 count = 3;
  CardRole role = 4;
  string reason = 5;
  Card card = 6;
}

message DeckCard {
  string oracle_id = 1;
  string name = 2;
  int32 count = 3;
  CardRole role = 4;
  // reason is one line on why this card is in the deck (D-19).
  string reason = 5;
  // owned says the collection covers the count (D-2).
  bool owned = 6;
  // owned_count is how many copies the collection has.
  int32 owned_count = 7;
  // price_usd is the card's display price at build time (D-17). Zero means
  // no price.
  double price_usd = 8;
  // owned_printing is the priciest printing of this card in the user's
  // collection, when the collection holds one. The UI shows its art in
  // place of the default printing (D-299). Unset when not owned.
  Printing owned_printing = 9;
  // outside_requested_sets marks a card that the sets of Slots.set_codes
  // do not hold. The build sets it once, so the mark says what was true
  // then, and a later snapshot does not move it (D-383). It is false on
  // every deck built with no set limit. Three things earn it: a card the
  // reader named by name (D-381), a mana card the reader allowed from
  // outside (D-382), and a basic land the sets do not print (D-378).
  bool outside_requested_sets = 10;
}

// CardRole is the job a card does in the deck (corpus section 6).
enum CardRole {
  CARD_ROLE_UNSPECIFIED = 0;
  CARD_ROLE_LAND = 1;
  CARD_ROLE_RAMP = 2;
  CARD_ROLE_DRAW = 3;
  CARD_ROLE_REMOVAL = 4;
  CARD_ROLE_WIPE = 5;
  CARD_ROLE_THREAT = 6;
  CARD_ROLE_INTERACTION = 7;
  CARD_ROLE_SYNERGY = 8;
  CARD_ROLE_WINCON = 9;
  CARD_ROLE_OTHER = 10;
}

// ValidationResult is the rules-engine verdict (guardrail 1, PR-5).
message ValidationResult {
  repeated Finding findings = 1;
  // passed means no finding has severity BLOCK.
  bool passed = 2;
  // legality_as_of is the card-snapshot date the engine checked against,
  // ISO 8601. Empty when the engine ran without a snapshot. This field is
  // authoritative: the last validation writes it, and Deck.legality_as_of
  // is the copy from the build.
  string legality_as_of = 3;
  // pool_rule is the ownership mode the engine applied (D-37).
  PoolRule pool_rule = 4;
  // format is the format the engine applied.
  FormatId format = 5;
}

// Finding is one problem the rules engine found.
message Finding {
  // code names the check, for example "banned_card" or "off_color".
  string code = 1;
  Severity severity = 2;
  string message = 3;
  // oracle_id points at the card, when the finding is about one card.
  string oracle_id = 4;
}

// Severity says what a finding blocks.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  // SEVERITY_BLOCK: the deck must not reach the user in this state.
  SEVERITY_BLOCK = 1;
  SEVERITY_WARN = 2;
  SEVERITY_INFO = 3;
}
