syntax = "proto3";

package mtg.v1;

import "mtg/v1/card.proto";
import "mtg/v1/format.proto";
import "mtg/v1/session.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/nkramber/mtg-deck-builder/go/gen/mtg/v1;mtgv1";

// Deck is one generated deck.
message Deck {
  string id = 1;
  string name = 2;
  Format format = 3;
  PowerLevel power = 4;
  // summary is one paragraph on the deck's style and purpose (D-19).
  string summary = 5;
  // commander_oracle_ids holds one commander, or two for partners.
  repeated string commander_oracle_ids = 6;
  repeated DeckCard cards = 7;
  ValidationResult validation = 8;
  // legality_as_of is the card-snapshot date of the build's validation,
  // ISO 8601. It is a copy: validation.legality_as_of is authoritative,
  // because the last validation writes it. The UI shows this copy.
  string legality_as_of = 9;
  // 10 held seed, which reproduced a build on request (D-18). PR-9 left
  // the MVP, and nothing ever set it. The number and the name are
  // reserved, so a later PR-9 must choose a new one and no stored deck
  // can be misread (D-256).
  reserved 10;
  reserved "seed";
  string session_id = 11;
  google.protobuf.Timestamp created_at = 12;
  // stale is reserved for the staleness pass (D-29, I-1), unset today.
  bool stale = 13;
  // stale_oracle_ids is reserved for the staleness pass (D-29, I-1),
  // unset today.
  repeated string stale_oracle_ids = 14;
  // sideboard holds up to 15 cards in 60-card formats. Empty in Commander.
  repeated DeckCard sideboard = 15;
  // companion_oracle_id names the companion, when the deck has one.
  // The companion sits in the sideboard and must pass its own check (F-18).
  string companion_oracle_id = 16;
  // upgrades lists unowned cards that improve the deck, with prices (D-2,
  // roadmap PR-6). Empty in owned-only mode. In any-card mode the buy list
  // is the unowned part of cards instead (D-37).
  repeated DeckCard upgrades = 17;
  // buy_cost_usd sums price_usd over the cards the user does not own.
  // Zero when every card is owned or no price is known.
  double buy_cost_usd = 18;
  // revised_from_deck_id names the deck this one revised, when the user
  // asked for a change after a build (PR-12B, D-283). Empty for a first
  // build and for a full rebuild after a slot change.
  string revised_from_deck_id = 19;
  // revision_note is the reply the user read with the revision: what
  // changed, and what the agent declined and why (D-284). Built from the
  // diff, not from the model.
  string revision_note = 20;
  // favorite marks a deck the user starred in the library (PR-17).
  // UpdateDeck is the one writer.
  bool favorite = 21;
  // card_count sums count over cards, the main deck alone. The list view
  // of ListDecks carries no cards, so it sets this field instead
  // (PR-17). GetDeck reads the whole deck, and its cards are the source.
  int32 card_count = 22;
}

// DeckCard is one card choice with its reason.
message DeckCard {
  string oracle_id = 1;
  string name = 2;
  int32 count = 3;
  CardRole role = 4;
  // reason is one line on why this card is in the deck (D-19).
  string reason = 5;
  // owned says the collection covers the count (D-2).
  bool owned = 6;
  // owned_count is how many copies the collection has.
  int32 owned_count = 7;
  // price_usd is the card's display price at build time (D-17). Zero means
  // no price.
  double price_usd = 8;
  // owned_printing is the priciest printing of this card in the user's
  // collection, when the collection holds one. The UI shows its art in
  // place of the default printing (D-299). Unset when not owned.
  Printing owned_printing = 9;
}

// CardRole is the job a card does in the deck (corpus section 6).
enum CardRole {
  CARD_ROLE_UNSPECIFIED = 0;
  CARD_ROLE_LAND = 1;
  CARD_ROLE_RAMP = 2;
  CARD_ROLE_DRAW = 3;
  CARD_ROLE_REMOVAL = 4;
  CARD_ROLE_WIPE = 5;
  CARD_ROLE_THREAT = 6;
  CARD_ROLE_INTERACTION = 7;
  CARD_ROLE_SYNERGY = 8;
  CARD_ROLE_WINCON = 9;
  CARD_ROLE_OTHER = 10;
}

// ValidationResult is the rules-engine verdict (guardrail 1, PR-5).
message ValidationResult {
  repeated Finding findings = 1;
  // passed means no finding has severity BLOCK.
  bool passed = 2;
  // legality_as_of is the card-snapshot date the engine checked against,
  // ISO 8601. Empty when the engine ran without a snapshot. This field is
  // authoritative: the last validation writes it, and Deck.legality_as_of
  // is the copy from the build.
  string legality_as_of = 3;
  // pool_rule is the ownership mode the engine applied (D-37).
  PoolRule pool_rule = 4;
  // format is the format the engine applied.
  FormatId format = 5;
}

// Finding is one problem the rules engine found.
message Finding {
  // code names the check, for example "banned_card" or "off_color".
  string code = 1;
  Severity severity = 2;
  string message = 3;
  // oracle_id points at the card, when the finding is about one card.
  string oracle_id = 4;
}

// Severity says what a finding blocks.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  // SEVERITY_BLOCK: the deck must not reach the user in this state.
  SEVERITY_BLOCK = 1;
  SEVERITY_WARN = 2;
  SEVERITY_INFO = 3;
}
