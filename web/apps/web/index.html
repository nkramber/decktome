<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The page never zooms and never pans sideways (owner instruction,
         D-624). This fails the axe meta-viewport rule under WCAG 1.4.4,
         and the PR-25 gate carries the exception on record. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS reads no SVG for a Home Screen icon, and it reads no
         manifest icon either, so the link names the PNG (PR-25). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0c16" />
    <meta name="description" content="An agentic Magic: The Gathering deck builder that reads the cards you own." />
    <!-- A Home Screen window with no browser chrome. iOS 26 does this
         by default, and the older name still serves an older phone. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Deck Tome" />
    <title>Deck Tome</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
